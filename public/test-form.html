<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Test Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #000;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
    .info {
      margin-top: 24px;
      padding: 16px;
      background: #f0f7ff;
      border-left: 4px solid #0066cc;
      border-radius: 4px;
      font-size: 12px;
      color: #333;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Avatar Test Form</h1>
    <p class="subtitle">Test your extension here</p>

    <form id="test-form">
      <label for="first-name">First Name</label>
      <input type="text" id="first-name" name="first_name" placeholder="John">

      <label for="last-name">Last Name</label>
      <input type="text" id="last-name" name="last_name" placeholder="Smith">

      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full_name" placeholder="John Smith">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="john@example.com">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="416-555-1234">

      <button type="submit">Submit</button>
    </form>

    <div class="info">
      <strong>Testing Tips:</strong><br>
      • Type in any field above<br>
      • Wait 2 seconds after you stop typing<br>
      • A popup should appear asking to save<br>
      • Check the console (F12) for logs<br>
      • Avatar logs start with "Avatar:"
    </div>
  </div>
</body>
</html>
