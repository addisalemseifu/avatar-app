<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 320px;
        min-height: 200px;
        font-family: sans-serif;
        background: #fff;
        color: #111;
      }

      .header {
        background: #000;
        color: #fff;
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 700;
      }

      .header p {
        font-size: 12px;
        color: #aaa;
        margin-top: 2px;
      }

      .body {
        padding: 20px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 10px;
      }

      .btn-primary {
        background: #000;
        color: #fff;
      }

      .btn-secondary {
        background: #f5f5f5;
        color: #333;
        border: 1px solid #eee;
      }

      .status {
        font-size: 13px;
        color: #555;
        text-align: center;
        margin-top: 8px;
        line-height: 1.5;
      }

      .status.success {
        color: #16a34a;
        font-weight: 500;
      }

      .status.error {
        color: #dc2626;
      }

      .avatar-info {
        background: #f9f9f9;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 14px;
        font-size: 13px;
        color: #444;
        line-height: 1.8;
        display: none;
      }

      .logout {
        font-size: 12px;
        color: #999;
        text-align: center;
        cursor: pointer;
        margin-top: 8px;
      }

      .logout:hover {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <h1>Avatar</h1>
        <p>Shop your size everywhere</p>
      </div>
    </div>

    <div class="body">
      <!-- Shown when not logged in -->
      <div id="logged-out">
        <p class="status" style="margin-bottom:16px;">Log in to filter any store to your exact size and style.</p>
        <input id="email" type="email" placeholder="Email" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:8px;" />
        <input id="password" type="password" placeholder="Password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:12px;" />
        <button class="btn btn-primary" id="login-btn">Log in</button>
        <p class="status" id="login-status"></p>
      </div>

      <!-- Shown when logged in -->
      <div id="logged-in" style="display:none;">
        <div class="avatar-info" id="avatar-info"></div>
        <button class="btn btn-primary" id="filter-btn">✨ Shop my size</button>
        <button class="btn btn-secondary" id="autofill-btn">📝 Fill my name</button>
        <button class="btn btn-secondary" id="reset-btn" style="display:none;">Show all products</button>
        <p class="status" id="filter-status"></p>
        <p class="logout" id="logout-btn">Log out</p>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
